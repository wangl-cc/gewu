[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
ignore = [
  # Remove these exceptions once Gewu can migrate off the crates after the upstream transition.
  # https://github.com/apache/arrow-rs/issues/9183
  { id = "RUSTSEC-2026-0543", reason = "Arrow and other dependencies still require chrono; RustSec has no patched version for this maintenance advisory" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause", # arrayref, used by GPUI's rendering stack
  "BSD-3-Clause",
  "CC0-1.0", # tiny-keccak
  "GPL-3.0-or-later",
  "ISC", # libloading, used by GPUI's Linux backend
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

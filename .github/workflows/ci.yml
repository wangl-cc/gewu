name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: make fmt-check-rust

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint-rust

  swift-style:
    name: Swift format and style
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: make lint-swift

  test:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test

  features:
    name: Core features (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [none, parquet, csv, xlsx]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.feature }}
      - name: Test and lint selected feature configuration
        env:
          FEATURE: ${{ matrix.feature }}
        run: make check-features

  deny:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make deny

  # Preserve the original Rust required-check name after splitting its work.
  rust:
    if: always()
    needs: [format, clippy, swift-style, test, features, deny, macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  macos-app:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.rust-target }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: xcode-27
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-26-intel
            rust-target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - name: Select the Xcode SDK for Rust and Swift
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Test Rust (Debug)
        run: make test
      - name: Build app and test Swift (Debug)
        run: make test-swift CONFIG=debug
      - name: Build, verify and archive app
        run: |
          make dist CONFIG=debug
          mv build/Gewu-macos.zip build/Gewu-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gewu-macos-${{ matrix.arch }}
          path: build/Gewu-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

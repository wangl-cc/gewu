name: Gewu
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
options:
  fileTypes:
    icon:
      file: true
configs:
  Debug: debug
  Release: release
  Performance: release
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ARCHS: $(NATIVE_ARCH_ACTUAL)
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: '6.0'
    RUST_PROFILE: release
    SWIFT_INCLUDE_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)/gewuFFI
targets:
  GewuBindings:
    type: library.static
    platform: macOS
    sources:
      - path: $(DERIVED_FILE_DIR)/GewuBindings.swift
        type: file
        optional: true
        buildPhase: sources
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES
    preBuildScripts:
      - script: exec /bin/bash "$SRCROOT/scripts/build-rust.sh"
        name: Build Rust and generate UniFFI bindings
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libgewu.a
          - $(DERIVED_FILE_DIR)/GewuBindings.swift
          - $(BUILT_PRODUCTS_DIR)/gewuFFI/gewuFFI.h
          - $(BUILT_PRODUCTS_DIR)/gewuFFI/gewu_data.h
          - $(BUILT_PRODUCTS_DIR)/gewuFFI/module.modulemap
  GewuKit:
    type: framework
    platform: macOS
    sources:
      - path: app/GewuKit/Sources
        includes: ['**/*.swift']
    dependencies:
      - target: GewuBindings
        link: true
      - framework: $(BUILT_PRODUCTS_DIR)/libgewu.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu.kit
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: '-'
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ['$(inherited)', '-liconv']
  GewuKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: app/GewuKit/Tests
        includes: ['**/*.swift']
    dependencies:
      - target: GewuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu.kit.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: '-'
  Gewu:
    type: application
    platform: macOS
    sources:
      - path: app/Sources/Gewu
        includes: ['**/*.swift']
      - path: app/Icons/Gewu.icon
        type: file
        buildPhase: resources
      - path: LICENSE
        type: file
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - target: GewuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Info.plist
        CURRENT_PROJECT_VERSION: '1'
        SPARKLE_PUBLIC_KEY: ''
        SPARKLE_FEED_URL: https://github.com/wangl-cc/gewu/releases/latest/download/appcast-$(ARCHS).xml
        ASSETCATALOG_COMPILER_APPICON_NAME: Gewu
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Performance:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu.performance
    preBuildScripts:
      - script: exec /bin/bash "$SRCROOT/scripts/app-info-plist.sh"
        name: Prepare Info.plist
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/Info.plist
  GewuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: app/Sources/Gewu
        includes: ['**/*.swift']
        excludes: [App/GewuApp.swift]
      - path: app/Tests
        includes: ['*.swift']
      - path: app/FrameTests
        includes: ['*.swift']
      - path: app/Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - target: GewuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ''
        BUNDLE_LOADER: ''
        CODE_SIGN_IDENTITY: '-'
  GewuUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [app/UITests]
    postBuildScripts:
      - name: Generate interaction fixture
        script: |
          set -eu
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          awk 'BEGIN { print "cohort,x,y"; for (i=0; i<8192; i++) printf "%s,%d,%d\n", i%16 ? "Other" : "Keep", i, i*239%8191 }' > "$SCRIPT_OUTPUT_FILE_0"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Interaction performance.csv
    dependencies:
      - target: Gewu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gewu
        CODE_SIGN_IDENTITY: '-'
schemes:
  GewuKit:
    build:
      targets:
        GewuKit: all
    test:
      config: Debug
      targets:
        - name: GewuKitTests

  GewuPerformance:
    build:
      targets:
        Gewu: all
    test:
      config: Performance
      debugEnabled: false
      targets:
        - name: GewuTests
          selectedTests: [FilterFrameTests]
          parallelizable: false
        - name: GewuUITests
          parallelizable: false

  Gewu:
    build:
      targets:
        Gewu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: GewuKitTests
        - name: GewuTests
          skippedTests: [FilterFrameTests]
    profile:
      config: Release
    archive:
      config: Release

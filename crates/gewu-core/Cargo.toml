[package]
name = "gewu-core"
description = "Data engine for the gewu table viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parquet", "csv", "xlsx"]
parquet = ["dep:parquet"]
csv = ["dep:arrow-csv", "dep:csv"]
xlsx = ["dep:calamine", "dep:rust_xlsxwriter"]

[dependencies]
arrow.workspace = true
parquet = { workspace = true, optional = true }
arrow-csv = { version = "60", optional = true }
csv = { version = "1", optional = true }
calamine = { version = "0.37", features = ["chrono"], optional = true }
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"], optional = true }
thiserror.workspace = true
chrono.workspace = true
tempfile = "3"
num-traits = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
rapidhash = "4.5.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "engine"
harness = false
required-features = ["parquet"]

[[bench]]
name = "find"
harness = false
required-features = ["parquet"]

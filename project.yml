name: Gewu
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
options:
  fileTypes:
    icon:
      file: true
configs:
  Debug: debug
  Release: release
  Release-LTO: release
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ARCHS: $(NATIVE_ARCH_ACTUAL)
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: '5.0'
  configs:
    Debug:
      RUST_PROFILE: dev
    Release:
      RUST_PROFILE: release
    Release-LTO:
      RUST_PROFILE: release-lto
targets:
  Gewu:
    type: application
    platform: macOS
    sources:
      - path: app/Sources/Gewu
        includes: ['**/*.swift']
        excludes: [Generated]
      - path: $(DERIVED_FILE_DIR)/gewu.swift
        type: file
        optional: true
        buildPhase: sources
      - path: app/Icons/Gewu.icon
        type: file
        buildPhase: resources
      - path: LICENSE
        type: file
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - framework: $(BUILT_PRODUCTS_DIR)/libgewu.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Info.plist
        CURRENT_PROJECT_VERSION: '1'
        SPARKLE_PUBLIC_KEY: ''
        SPARKLE_FEED_URL: https://github.com/wangl-cc/gewu/releases/latest/download/appcast-$(ARCHS).xml
        ASSETCATALOG_COMPILER_APPICON_NAME: Gewu
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file="$(DERIVED_FILE_DIR)/gewuFFI.modulemap"
        OTHER_LDFLAGS: ['$(inherited)', '-liconv']
    preBuildScripts:
      - script: exec /bin/bash "$SRCROOT/scripts/build-rust.sh"
        name: Build Rust and generate UniFFI bindings
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libgewu.a
          - $(DERIVED_FILE_DIR)/gewu.swift
          - $(DERIVED_FILE_DIR)/gewuFFI.h
          - $(DERIVED_FILE_DIR)/gewuFFI.modulemap
          - $(DERIVED_FILE_DIR)/Info.plist
  GewuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: app/Sources/Gewu
        includes: ['**/*.swift']
        excludes: [Generated, App/GewuApp.swift]
      - path: $(GEWU_DERIVED_SOURCES)/gewu.swift
        type: file
        optional: true
        buildPhase: sources
      - path: app/Tests
        includes: ['*.swift']
      - path: app/Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - target: Gewu
        link: false
      - framework: $(BUILT_PRODUCTS_DIR)/libgewu.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wangl-cc.gewu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ''
        BUNDLE_LOADER: ''
        GEWU_DERIVED_SOURCES: $(PROJECT_TEMP_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/Gewu.build/DerivedSources
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file="$(GEWU_DERIVED_SOURCES)/gewuFFI.modulemap"
        OTHER_LDFLAGS: ['$(inherited)', '-liconv']
        CODE_SIGN_IDENTITY: '-'
schemes:
  Gewu:
    build:
      targets:
        Gewu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GewuTests
    profile:
      config: Release-LTO
    archive:
      config: Release-LTO

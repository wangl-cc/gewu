name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-package-check:
    name: Verify native macOS bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTFLAGS: -Ctarget-cpu=apple-m1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify local bundle
        run: |
          cargo build --locked --release -p gewu-gpui
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "gewu-gpui") | .version')
          scripts/package-macos.sh target/release/gewu-gpui "$version" "$GITHUB_RUN_NUMBER" build/native
          app=build/native/Gewu.app
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = io.github.wangl-cc.gewu
          test -s "$app/Contents/Resources/Gewu.icns"
          test -s "$app/Contents/Resources/Assets.car"

  version:
    name: Check version
    if: ${{ github.event_name == 'push' && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check update signing configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_KEY" || -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo '::error::Configure SPARKLE_PUBLIC_KEY (variable) and SPARKLE_PRIVATE_KEY (secret) before releasing.'
            exit 1
          fi
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a stable version tag: vX.Y.Z'
            exit 1
          fi
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "gewu-gpui") | .version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo version $version"
            exit 1
          fi

  rust-checks:
    name: Rust checks
    needs: version
    uses: ./.github/workflows/ci-rust.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.rust-target }}
      RUSTFLAGS: -Ctarget-cpu=${{ matrix.cpu }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cpu: apple-m1
            runner: xcode-27
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            cpu: x86-64
            runner: macos-26-intel
            rust-target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      - name: Build and sign native bundle
        env:
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION }}
          ARCH: ${{ matrix.arch }}
        run: |
          : "${SIGNING_IDENTITY:?Configure DEVELOPER_ID_APPLICATION}"
          cargo build --locked --release -p gewu-gpui -p gewu-update
          binaries="target/$CARGO_BUILD_TARGET/release"
          scripts/package-macos.sh "$binaries/gewu-gpui" "${RELEASE_TAG#v}" "$BUILD_NUMBER" build/native "$binaries/gewu-update"
          lipo build/native/Gewu.app/Contents/MacOS/Gewu -verify_arch "$ARCH"
          lipo build/native/Gewu.app/Contents/Helpers/gewu-update -verify_arch "$ARCH"
      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          app=build/native/Gewu.app
          ditto -c -k --sequesterRsrc --keepParent "$app" build/notarization.zip
          xcrun notarytool submit build/notarization.zip --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --wait --output-format json > build/notary-result.json
          jq -e '.status == "Accepted"' build/notary-result.json
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          mkdir -p build/updates
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/updates/Gewu-$RELEASE_TAG-macos-$ARCH.zip"
      - name: Get pinned update signing tools
        run: |
          release=https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          curl --fail --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/Sparkle.tar.xz" "$release"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/gewu-signing-tools"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/gewu-signing-tools"
      - name: Sign update and generate appcast
        env:
          ARCH: ${{ matrix.arch }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$RUNNER_TEMP/gewu-signing-tools/bin/generate_appcast" \
              --ed-key-file - --maximum-deltas 0 \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases" \
              -o "build/updates/appcast-$ARCH.xml" build/updates
          signature="$(xmllint --xpath 'string(/rss/channel/item/enclosure/@*[local-name()="edSignature"])' \
            "build/updates/appcast-$ARCH.xml")"
          if [[ -z "$signature" ]]; then
            echo '::error::The appcast has no signed update. Check that the public and private keys match.'
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$RUNNER_TEMP/gewu-signing-tools/bin/sign_update" \
              --ed-key-file - --verify "build/updates/Gewu-$RELEASE_TAG-macos-$ARCH.zip" "$signature"
          scripts/sign-native-update.sh "$RUNNER_TEMP/gewu-signing-tools/bin/sign_update" \
            build/native/Gewu.app "build/updates/Gewu-$RELEASE_TAG-macos-$ARCH.zip" "$ARCH" "build/updates/update-$ARCH.json"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            build/updates/Gewu-*.zip
            build/updates/appcast-*.xml
            build/updates/update-*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [version, rust-checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check archives
        working-directory: dist
        run: |
          test -s "Gewu-$RELEASE_TAG-macos-arm64.zip"
          test -s "Gewu-$RELEASE_TAG-macos-x86_64.zip"
          test -s appcast-arm64.xml
          test -s appcast-x86_64.xml
          test -s update-arm64.json
          test -s update-x86_64.json
      - name: Create or reuse draft release
        run: |
          draft="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')"
          case "$draft" in
            '') gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes ;;
            true) ;;
            false) echo '::error::This version is already published; its assets will not be replaced.'; exit 1 ;;
            *) echo '::error::Unexpected release state'; exit 1 ;;
          esac
      - name: Upload assets
        working-directory: dist
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "Gewu-$RELEASE_TAG-macos-arm64.zip" "Gewu-$RELEASE_TAG-macos-x86_64.zip" \
            appcast-arm64.xml appcast-x86_64.xml update-arm64.json update-x86_64.json
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false

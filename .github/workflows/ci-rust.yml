name: CI (Rust)

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'gpui/**'
      - 'assets/macos/**'
      - 'scripts/package-macos.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'deny.toml'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tools/**'
      - 'gpui/**'
      - 'assets/macos/**'
      - 'scripts/package-macos.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'deny.toml'
      - '.github/workflows/ci-rust.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Lint (format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check code formatting
        run: cargo +nightly fmt --all --check

  clippy:
    name: Lint Rust and verify layer boundaries
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Lint Rust sources
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p gewu-gpui --no-default-features --all-targets -- -D warnings
      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Check model dependency boundaries
        run: |
          cargo tree --locked -p gewu-core -p gewu-app --edges normal,build --prefix none > model-dependencies.txt
          if grep -Eq '^gpui([-_ ]|$)' model-dependencies.txt; then
            echo "::error::Core and gewu-app must build without a GPUI dependency"
            exit 1
          fi

  deny:
    name: Lint (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: cargo deny --locked check

  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, xcode-27]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Test models and tools on Linux
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --workspace --exclude gewu-gpui
          cargo test --locked -p gewu-core --no-default-features
          for codec in csv parquet xlsx; do
            cargo test --locked -p gewu-core --no-default-features --features "$codec"
          done
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libasound2-dev libxkbcommon-x11-dev libwayland-dev libxcb-xfixes0-dev libx11-xcb-dev libvulkan-dev
          cargo check --locked -p gewu-gpui
      - name: Test native app on macOS
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --workspace
          cargo test --locked -p gewu-gpui --example scroll
          cargo check --locked -p gewu-gpui --no-default-features --all-targets
      - name: Package preview
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          RUSTFLAGS: -Ctarget-cpu=apple-m1
        run: |
          cargo build --locked -p gewu-gpui
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "gewu-gpui") | .version')
          scripts/package-macos.sh target/debug/gewu-gpui "$version" "$GITHUB_RUN_NUMBER" build/preview
          ditto -c -k --sequesterRsrc --keepParent build/preview/Gewu.app build/preview/Gewu-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: Gewu-macos-arm64
          path: build/preview/Gewu-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage report
        run: cargo llvm-cov --locked -p gewu-core --all-features --codecov --output-path codecov.json
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: false

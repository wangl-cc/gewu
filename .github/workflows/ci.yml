name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses options only nightly rustfmt understands.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Core codec feature combinations
        run: |
          cargo test -p gewu-core --no-default-features
          cargo clippy -p gewu-core --all-targets --no-default-features -- -D warnings
          for codec in parquet csv xlsx; do
            cargo test -p gewu-core --no-default-features --features "$codec"
            cargo clippy -p gewu-core --all-targets --no-default-features --features "$codec" -- -D warnings
          done

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Rust core and Swift bindings
        run: scripts/build-apple.sh
      - name: Build app
        working-directory: app
        run: swift build

[package]
name = "gewu-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Narrow AppKit and Foundation operations used by Gewu"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
ignore = [
  # UniFFI 0.32.2 uses Askama 0.16.1; neither has a newer release yet.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is an unmaintained build-time dependency of the Swift binding generator; no patched version is available" },
  # Remove these exceptions once Gewu can migrate off the crates after the upstream transition.
  # https://github.com/apache/arrow-rs/issues/9183
  { id = "RUSTSEC-2026-0543", reason = "Arrow and other dependencies still require chrono; RustSec has no patched version for this maintenance advisory" },
  { id = "RUSTSEC-2026-0555", reason = "Arrow uses chrono-tz for named time zone support; RustSec has no patched version for this maintenance advisory" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "GPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

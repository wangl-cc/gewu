[package]
name = "gewu-update"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Verify and install signed Gewu macOS releases"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
ring = "0.17"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

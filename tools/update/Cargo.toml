[package]
name = "gewu-update"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Verify and install signed Gewu macOS releases"

[lints]
workspace = true

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFError", "CFNumber", "CFString", "CFURL"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSData", "NSDate", "NSDictionary", "NSError", "NSObject", "NSOperation", "NSProcessInfo", "NSPropertyList", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "CSCommon", "SecBase", "SecCode", "SecRequirement", "SecStaticCode"] }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

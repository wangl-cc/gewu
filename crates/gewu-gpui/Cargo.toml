[package]
name = "gewu-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Native GPUI table over gewu-core"

[lints]
workspace = true

[dependencies]
dirs = "6"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono.workspace = true
url = "2"
async-channel = "2"
gewu-app = { path = "../gewu-app" }
gewu-core = { path = "../gewu-core" }
gpui-kit = { version = "=0.10.0", default-features = false, features = ["component", "assets"] }

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast"]
ui-capture = []

[dev-dependencies]
gpui-kit = { version = "=0.10.0", default-features = false, features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAccessibility", "NSApplication", "NSButton", "NSCell", "NSControl", "NSDocumentController", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSStackView", "NSText", "NSTextField", "NSUserInterfaceLayout", "NSView", "NSWindow", "NSWorkspace", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSEnumerator", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSGraphicsContext"] }

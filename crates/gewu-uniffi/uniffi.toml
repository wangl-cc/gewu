# Swift-side names for the generated bindings. GewuKit compiles them as
# internal declarations beside its own public types, so every exported
# type carries an Ffi prefix to keep the two vocabularies apart.
[bindings.swift.rename]
AnalysisCapabilities = "FfiAnalysisCapabilities"
AnalysisErrorKind = "FfiAnalysisErrorKind"
AnalysisField = "FfiAnalysisField"
AnalysisOperation = "FfiAnalysisOperation"
AxisScale = "FfiAxisScale"
BufferView = "FfiBufferView"
CellMatch = "FfiCellMatch"
ColumnCapabilities = "FfiColumnCapabilities"
ColumnFilter = "FfiColumnFilter"
ColumnHighlight = "FfiColumnHighlight"
ColumnId = "FfiColumnId"
ColumnInfo = "FfiColumnInfo"
ColumnSort = "FfiColumnSort"
ColumnText = "FfiColumnText"
DatasetInfo = "FfiDatasetInfo"
ExportErrorKind = "FfiExportErrorKind"
ExportOptions = "FfiExportOptions"
ExportProgress = "FfiExportProgress"
FileErrorKind = "FfiFileErrorKind"
FileMetadata = "FfiFileMetadata"
FileType = "FfiFileType"
Filter = "FfiFilter"
FilterChoices = "FfiFilterChoices"
FilterCondition = "FfiFilterCondition"
FilterErrorKind = "FfiFilterErrorKind"
FindErrorKind = "FfiFindErrorKind"
FindHighlight = "FfiFindHighlight"
FindLimits = "FfiFindLimits"
FindSession = "FfiFindSession"
GewuDataset = "FfiDataset"
GewuError = "FfiError"
GewuExport = "FfiExport"
GewuFilteredView = "FfiFilteredView"
GewuOrderedView = "FfiOrderedView"
Histogram = "FfiHistogram"
IoOperation = "FfiIoOperation"
KeyValue = "FfiKeyValue"
LengthSummary = "FfiLengthSummary"
LengthUnit = "FfiLengthUnit"
LimitErrorKind = "FfiLimitErrorKind"
NumericStatistics = "FfiNumericStatistics"
OpenOptions = "FfiOpenOptions"
ParquetCompression = "FfiParquetCompression"
RangeBound = "FfiRangeBound"
RangeBounds = "FfiRangeBounds"
RangeHistogram = "FfiRangeHistogram"
RowIndices = "FfiRowIndices"
ScatterAxisKind = "FfiScatterAxisKind"
ScatterPoint = "FfiScatterPoint"
ScatterResult = "FfiScatterResult"
TextMatch = "FfiTextMatch"
ValueCategory = "FfiValueCategory"
ValueChoice = "FfiValueChoice"
ValueFrequency = "FfiValueFrequency"
ValueParseError = "FfiValueParseError"
ValueSummary = "FfiValueSummary"

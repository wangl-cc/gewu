name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: make fmt-check-rust

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint-rust

  swift-style:
    name: Swift format and style
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: make lint-swift

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test

  codecs:
    name: Core codec (${{ matrix.codec }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codec: [none, parquet, csv, xlsx]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: codec-${{ matrix.codec }}
      - name: Test and lint selected codec
        env:
          CODEC: ${{ matrix.codec }}
        run: make check-features

  deny:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make deny

  # Preserve the original Rust required-check name after splitting its work.
  rust:
    if: always()
    needs: [format, clippy, test, codecs, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Rust checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  macos-app:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's macOS 27 image is named for its Xcode toolchain.
          - arch: arm64
            runner: xcode-27
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-26-intel
            rust-target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build, verify and archive app
        run: |
          make dist CONFIG=release-lto
          mv build/Gewu-macos.zip build/Gewu-macos-${{ matrix.arch }}.zip
      - name: Test Swift table and copy execution
        run: make test-swift CONFIG=release-lto
      - uses: actions/upload-artifact@v4
        with:
          name: Gewu-macos-${{ matrix.arch }}
          path: build/Gewu-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

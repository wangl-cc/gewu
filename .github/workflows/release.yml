name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Check version
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check update signing configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_KEY" || -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo '::error::Configure SPARKLE_PUBLIC_KEY (variable) and SPARKLE_PRIVATE_KEY (secret) before releasing.'
            exit 1
          fi
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a stable version tag: vX.Y.Z'
            exit 1
          fi
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "gewu-uniffi") | .version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo version $version"
            exit 1
          fi

  rust-checks:
    name: Rust checks
    needs: version
    uses: ./.github/workflows/ci-rust.yml

  app-checks:
    name: App checks
    needs: version
    uses: ./.github/workflows/ci-app.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.rust-target }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: xcode-27
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-26-intel
            rust-target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Generate Xcode project
        run: xcodegen generate --use-cache
      - name: Archive app (Release-LTO)
        run: |
          xcodebuild -quiet -project Gewu.xcodeproj -scheme Gewu -configuration Release-LTO \
            -destination 'generic/platform=macOS' -derivedDataPath build/xcode \
            -archivePath build/Gewu.xcarchive CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" archive
      - name: Verify and package archived app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app=build/Gewu.xcarchive/Products/Applications/Gewu.app
          lipo "$app/Contents/MacOS/Gewu" -verify_arch "$ARCH"
          codesign --verify --deep --strict "$app"
          mkdir -p build/updates
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/updates/Gewu-$RELEASE_TAG-macos-$ARCH.zip"
      - name: Sign update and generate appcast
        env:
          ARCH: ${{ matrix.arch }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            build/xcode/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - --maximum-deltas 0 \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases" \
              -o "build/updates/appcast-$ARCH.xml" build/updates
          signature="$(xmllint --xpath 'string(/rss/channel/item/enclosure/@*[local-name()="edSignature"])' \
            "build/updates/appcast-$ARCH.xml")"
          if [[ -z "$signature" ]]; then
            echo '::error::The appcast has no signed update. Check that the public and private keys match.'
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            build/xcode/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update \
              --ed-key-file - --verify "build/updates/Gewu-$RELEASE_TAG-macos-$ARCH.zip" "$signature"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            build/updates/Gewu-*.zip
            build/updates/appcast-*.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [version, rust-checks, app-checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check archives
        working-directory: dist
        run: |
          test -s "Gewu-$RELEASE_TAG-macos-arm64.zip"
          test -s "Gewu-$RELEASE_TAG-macos-x86_64.zip"
          test -s appcast-arm64.xml
          test -s appcast-x86_64.xml
      - name: Create or reuse draft release
        run: |
          draft="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')"
          case "$draft" in
            '') gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes ;;
            true) ;;
            false) echo '::error::This version is already published; its assets will not be replaced.'; exit 1 ;;
            *) echo '::error::Unexpected release state'; exit 1 ;;
          esac
      - name: Upload assets
        working-directory: dist
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "Gewu-$RELEASE_TAG-macos-arm64.zip" "Gewu-$RELEASE_TAG-macos-x86_64.zip" \
            appcast-arm64.xml appcast-x86_64.xml
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false
